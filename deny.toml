# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
unmaintained = "workspace"
ignore = [
    # chrono unmaintained advisory RUSTSEC-2026-0543
    { id = "RUSTSEC-2026-0543", reason = "Used only for local timestamp string formatting in db.rs and logging.rs" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "blessing",
    "WTFPL",
    "LicenseRef-UFL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
# Duplicate-version baseline (2026-11-21): windows-sys 0.52.0 (winit), 0.59.0
# (global-hotkey), and 0.61.2 (direct plus arboard/eframe/etc.) are currently
# required by transitive constraints. Keep `warn` until an upgrade can unify them.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
