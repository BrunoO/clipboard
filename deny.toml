# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
unmaintained = "workspace"
ignore = [
    # quick-xml < 0.41.0 transitive dependency via eframe -> accesskit_winit -> atspi -> zbus_xml
    { id = "RUSTSEC-2026-0194", reason = "Transitive dependency through eframe/accesskit" },
    { id = "RUSTSEC-2026-0195", reason = "Transitive dependency through eframe/accesskit" },
    # sqlcipher-src pinned by libsqlite3-sys =0.39.1 via rusqlite bundled-sqlcipher
    { id = "RUSTSEC-2026-0502", reason = "Transitive dependency through rusqlite bundled-sqlcipher" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "blessing",
    "WTFPL",
    "LicenseRef-UFL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
