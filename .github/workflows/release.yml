name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release version and tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          $inputTag = "$env:INPUT_TAG".Trim()
          if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
            $tag = $inputTag
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $cargoToml = Get-Content Cargo.toml -Raw
            if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
              $tag = "v$($matches[1])"
            } else {
              $tag = "v0.1.0"
            }
          }
          $version = $tag.TrimStart('v')
          Write-Host "Resolved Version: $version"
          Write-Host "Resolved Tag: $tag"
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Configure native Perl and linker flags for vendored OpenSSL
        shell: pwsh
        run: |
          $strawberryPerl = "C:\Strawberry\perl\bin\perl.exe"
          if (Test-Path $strawberryPerl -PathType Leaf) {
            "OPENSSL_SRC_PERL=$strawberryPerl" >> $env:GITHUB_ENV
            Write-Host "Using Strawberry Perl for openssl-src: $strawberryPerl"
          } else {
            Write-Host "Strawberry Perl not found at $strawberryPerl; using default perl on PATH"
          }
          # Vendored OpenSSL (openssl-src) triggers MSVC LNK4099 ("PDB 'ossl_static.pdb'
          # was not found"), which Cargo's CARGO_BUILD_WARNINGS=deny turns into a fatal
          # linker_messages error.
          "RUSTFLAGS=-A linker-messages" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify executable and static OpenSSL linkage
        shell: pwsh
        run: |
          $exePath = "target\release\CipherClipboard.exe"
          if (-not (Test-Path $exePath)) {
            throw "$exePath was not found after compilation!"
          }
          $versionInfo = (Get-Item $exePath).VersionInfo
          if ($versionInfo.ProductName -ne "CipherClipboard" -or [string]::IsNullOrWhiteSpace($versionInfo.FileDescription)) {
            throw "$exePath is missing embedded Windows icon/version resources"
          }
          Write-Host "Embedded version resource: $($versionInfo.ProductName) $($versionInfo.ProductVersion)"
          $exeText = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $exePath).Path))
          if ($exeText -match 'libcrypto-\d+-x64\.dll') {
            throw "$exePath unexpectedly imports an external OpenSSL DLL ($($matches[0])) instead of linking vendored OpenSSL statically"
          }
          Write-Host "CipherClipboard.exe built cleanly with statically linked vendored OpenSSL."

      - name: Download Visual C++ redistributable
        shell: pwsh
        run: |
          $redist = "target\release\vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $redist -UseBasicParsing
          if (-not (Test-Path $redist)) {
            throw "Failed to download the Visual C++ redistributable"
          }
          $signature = Get-AuthenticodeSignature -FilePath $redist
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Downloaded VC++ redistributable is not validly signed by Microsoft (status: $($signature.Status))"
          }
          Write-Host "Staged Microsoft-signed VC++ redistributable: $redist"

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          & iscc.exe /DMyAppVersion="$env:VERSION" scripts\windows\setup.iss

      - name: Package portable ZIP archive
        shell: pwsh
        run: |
          $portableDir = "dist\CipherClipboard-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item "target\release\CipherClipboard.exe" -Destination $portableDir
          Copy-Item "target\release\vc_redist.x64.exe" -Destination $portableDir
          Copy-Item "assets\icon.ico" -Destination $portableDir
          Copy-Item "assets\icon.png" -Destination $portableDir
          Copy-Item "README.md" -Destination $portableDir
          Copy-Item "LICENSE" -Destination $portableDir
          Compress-Archive -Path "$portableDir\*" -DestinationPath "dist\CipherClipboard-$env:VERSION-windows-x64-portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Package MSIX for Microsoft Store
        shell: pwsh
        env:
          MSSTORE_PACKAGE_NAME: ${{ vars.MSSTORE_PACKAGE_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          .\scripts\windows\package-msix.ps1 -Version "$env:VERSION"

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "dist" -File | Where-Object { $_.Extension -in @(".exe", ".zip", ".msix") })
          if ($files.Count -eq 0) {
            throw "No Windows release artifacts found in dist to checksum"
          }
          $sums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $entry = "$hash *$($file.Name)"
            $sums += $entry
            $entry | Set-Content -Path "$($file.FullName).sha256" -Encoding ascii
            Write-Host "File: $($file.Name) | SHA256: $hash"
          }
          $sums | Set-Content -Path "dist\SHA256SUMS-windows-x64.txt" -Encoding ascii

      - name: Attest Windows build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.msix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: CipherClipboard ${{ env.TAG_NAME }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.msix
            dist/*.sha256
            dist/SHA256SUMS-windows-x64.txt

  release-linux:
    name: Build & Package Linux (x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libdbus-1-dev libssl-dev pkg-config

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache: false

      - name: Resolve release version and tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          input_tag="$INPUT_TAG"
          if [ -n "$input_tag" ]; then
            tag="$input_tag"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
            tag="v$version"
          fi
          version="${tag#v}"
          echo "Resolved Version: $version"
          echo "Resolved Tag: $tag"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify release executable exists
        run: |
          if [ ! -f "target/release/CipherClipboard" ]; then
            echo "target/release/CipherClipboard was not found after compilation!"
            exit 1
          fi
          echo "CipherClipboard built successfully."

      - name: Package tarball
        run: |
          set -e
          package_dir="dist/CipherClipboard-${VERSION}-linux-x64"
          mkdir -p "$package_dir"
          cp "target/release/CipherClipboard" "$package_dir/"
          chmod +x "$package_dir/CipherClipboard"
          cp "assets/icon.png" "$package_dir/"
          cp "README.md" "$package_dir/"
          cp "LICENSE" "$package_dir/"
          tar -czf "dist/CipherClipboard-${VERSION}-linux-x64.tar.gz" -C dist "CipherClipboard-${VERSION}-linux-x64"
          rm -rf "$package_dir"

      - name: Compute SHA-256 checksums
        run: |
          set -e
          cd dist
          for file in *.tar.gz; do
            sha256sum -- "$file" > "$file.sha256"
          done
          sha256sum -- *.tar.gz > SHA256SUMS-linux-x64.txt

      - name: Attest Linux build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: CipherClipboard ${{ env.TAG_NAME }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS-linux-x64.txt
          generate_release_notes: true
          draft: false
          prerelease: false
