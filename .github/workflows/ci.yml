name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libdbus-1-dev libssl-dev pkg-config

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt -- --check

      - name: Run Clippy static analysis
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libdbus-1-dev libssl-dev pkg-config

      - name: Install Windows OpenSSL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\windows\setup-openssl-ci.ps1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          components: clippy

      - name: Run Clippy on target platform
        if: runner.os != 'Linux'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets --locked --verbose

  macos-quit-smoke:
    name: macOS quit smoke test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2

      - name: Build debug binary
        run: cargo build --locked

      # Guards against AppKit/winit teardown crashes on quit (e.g. the uncaught
      # NSRangeException from _NSTouchBarFinderObservation). The debug-only
      # CIPHERCLIPBOARD_SMOKE_QUIT_MS hook triggers the same quit path as the UI button.
      - name: Launch and quit the app
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          CIPHERCLIPBOARD_SMOKE_QUIT_MS=5000 ./target/debug/CipherClipboard > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "App did not exit within 60s"
            kill -9 "$pid"
            cat "$RUNNER_TEMP/smoke.log"
            exit 1
          fi
          status=0
          wait "$pid" || status=$?
          cat "$RUNNER_TEMP/smoke.log"
          if [ "$status" -ne 0 ]; then
            echo "App exited with status $status (expected 0)"
            exit 1
          fi

  windows-quit-smoke:
    name: Windows quit smoke test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Windows OpenSSL dependencies
        shell: pwsh
        run: .\scripts\windows\setup-openssl-ci.ps1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2

      - name: Build debug binary
        run: cargo build --locked

      # Guards startup, TrayMenuHost window creation, and clean quit on Windows.
      # The debug-only CIPHERCLIPBOARD_SMOKE_QUIT_MS hook triggers a regular Quit.
      - name: Launch and quit the app
        shell: pwsh
        run: |
          $smokeHome = Join-Path $env:RUNNER_TEMP "smoke-home"
          New-Item -ItemType Directory -Path $smokeHome -Force | Out-Null
          $env:LOCALAPPDATA = $smokeHome
          $env:APPDATA = $smokeHome
          $env:CIPHERCLIPBOARD_SMOKE_QUIT_MS = "5000"
          $logFile = Join-Path $env:RUNNER_TEMP "smoke-windows.log"
          $errFile = Join-Path $env:RUNNER_TEMP "smoke-windows.err.log"
          $proc = Start-Process -FilePath ".\target\debug\CipherClipboard.exe" -PassThru -RedirectStandardOutput $logFile -RedirectStandardError $errFile
          $exited = $proc.WaitForExit(60000)
          if ($exited) {
            # Ensure ExitCode and redirected streams are flushed cleanly.
            $proc.WaitForExit()
          }
          if (Test-Path $logFile) { Get-Content $logFile }
          if (Test-Path $errFile) { Get-Content $errFile }
          $appDataDir = [Environment]::GetFolderPath('LocalApplicationData')
          $appLog = Join-Path $appDataDir "cipherclipboard\app.log"
          if (Test-Path $appLog) {
            Write-Host "--- app.log ---"
            Get-Content $appLog
          }
          if (-not $exited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "App did not exit within 60s"
          }
          if ($proc.ExitCode -ne 0) {
            throw "App exited with status $($proc.ExitCode) (expected 0)"
          }

  security:
    name: Supply Chain & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo-deny security & license check
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
