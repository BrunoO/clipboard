[package]
name = "cipherclipboard"
version = "0.1.0"
edition = "2021"
description = "A simple, encrypted cross-platform clipboard manager in Rust"
authors = ["BrunoO"]
license = "MIT"
repository = "https://github.com/BrunoO/clipboard"
readme = "README.md"
default-run = "CipherClipboard"

[[bin]]
name = "CipherClipboard"
path = "src/main.rs"

[package.metadata.bundle]
name = "CipherClipboard"
identifier = "com.cipherclipboard.app"
icon = ["assets/icon.icns"]
version = "0.1.0"
copyright = "Copyright (c) 2026 BrunoO"
category = "Utility"
short_description = "Encrypted Clipboard Manager"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dependencies]
eframe = "0.37"
egui_extras = { version = "0.29", features = ["syntect"] }
egui-phosphor = "0.7.3"

# Cross-platform clipboard reading and writing
arboard = "3.4"

# Global OS shortcut manager (Cmd+Shift+V / Ctrl+Shift+V)
global-hotkey = "0.9"

# SQLite with bundled SQLCipher (full database encryption)
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }

# OS Keyring for secure key storage (macOS Keychain, Windows Credential Manager, Linux Secret Service)
keyring = "4.2"

# Cross-platform standard directories (app data directory)
dirs = "7.0"

# Time and utilities
chrono = { version = "0.4" }
rand = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2.5"
webbrowser = "1.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"

# Production release configuration: maximal optimization, thin LTO, symbol stripping
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
