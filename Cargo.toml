[package]
name = "rusty-clipboard"
version = "0.1.0"
edition = "2021"
description = "A simple, encrypted cross-platform clipboard manager in Rust"
authors = ["Your Name"]

[dependencies]
# Pure Rust immediate-mode GUI framework
eframe = "0.29"

# Cross-platform clipboard reading and writing
arboard = "3.4"

# Global OS shortcut manager (Cmd+Shift+V / Ctrl+Shift+V)
global-hotkey = "0.9"

# SQLite with bundled SQLCipher (full database encryption)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# OS Keyring for secure key storage (macOS Keychain, Windows Credential Manager, Linux Secret Service)
keyring = "3.2"

# Cross-platform standard directories (app data directory)
dirs = "5.0"

# Time and utilities
chrono = { version = "0.4" }
rand = "0.8"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.17"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"

# Production release configuration: maximal optimization, thin LTO, symbol stripping
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
